version: '3.8'

services:
  db_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketrush_test
    ports:
      - "5433:5432"
    restart: on-failure

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
