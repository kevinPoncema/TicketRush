version: '3.8'

services:
  db_test:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ticketrush_test
    ports:
      - "5433:5432"
    restart: on-failure

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  app_test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db_test:5432/ticketrush_test
      - JWT_SECRET=test-secret
      - REDIS_HOST=redis_test
      - REDIS_PORT=6379
      - HMAC_SECRET=test-secret
    depends_on:
      - db_test
      - redis_test
    command: sh -c "sleep 5 && npm run test:e2e"
